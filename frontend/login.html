<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhotoPlatform - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <h1>PhotoPlatform</h1>

            <p class="subtitle">
                Acesse seu painel
            </p>

            <form id="login-form">

                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >


                <label for="password">
                    Senha
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >


                <div
                    id="error"
                    class="error hidden">
                </div>


                <button
                    id="login-button"
                    type="submit">
                    Entrar
                </button>

            </form>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
